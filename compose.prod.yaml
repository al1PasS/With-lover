x-logging: &gateway-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *gateway-logging
    security_opt:
      - no-new-privileges:true
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 6

volumes:
  caddy_data:
  caddy_config:
