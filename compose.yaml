x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  database:
    image: postgres:17.6-alpine
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: shiguang
      POSTGRES_USER: shiguang
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U shiguang -d shiguang']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  api:
    build: ./backend
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/shiguang
      DATABASE_USER: shiguang
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ARK_API_KEY: ${ARK_API_KEY:-}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - media:/app/media
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://localhost:8080/actuator/health | grep -q ''"status":"UP"''']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  web:
    build:
      context: ./frontend
      args:
        VITE_DEMO: 'false'
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1/healthz | grep -q ok']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
volumes:
  database:
  media:
