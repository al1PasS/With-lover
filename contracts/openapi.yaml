openapi: 3.0.3
info:
  title: 拾光 API
  version: 0.1.0
  description: 初始工程的已实现接口。所有写操作必须提交 CSRF 请求头。
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /auth/members:
    get:
      description: 当前双人空间的稳定账号 ID 与显示昵称，不返回登录用户名。
      responses:
        "200":
          description: 成员目录
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name]
                  properties:
                    id: { type: integer }
                    name: { type: string }
  /settings/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string, enum: [cover, messages, wishes, garden, gacha] } }
    get:
      responses:
        "200":
          description: 共享设置；记录盒和愿望单含版本及服务端补齐的作者。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingValue" }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingValue" }
      responses:
        "200":
          description: 已保存，记录盒和愿望单的身份与发布时间由服务端确定。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingValue" }
        "409": { description: 版本冲突，须先重新加载 }
  /interactions/{module}/{id}:
    parameters: &postTarget
      - { name: module, in: path, required: true, schema: { type: string, enum: [memories, messages] } }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      parameters:
        - { name: before, in: query, schema: { type: integer, format: int64 } }
      responses: &postResponse
        "200":
          description: 当前账号是否点赞、计数及最近评论（每页最多 20 条）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostInteractions" }
        "404": { description: 内容不存在、已删除或未发布 }
  /interactions/{module}/{id}/like:
    parameters: *postTarget
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [liked]
              properties:
                liked: { type: boolean }
      responses: *postResponse
  /interactions/{module}/{id}/comments:
    parameters: *postTarget
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
      responses: *postResponse
  /albums:
    get:
      responses: &albumList
        "200":
          description: 相册与封面元数据
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Album" } }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlbumInput" }
      responses:
        "201":
          description: 已创建相册
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Album" }
  /public/albums:
    get:
      security: []
      responses: *albumList
  /albums/{id}:
    parameters: &albumId
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      responses: &albumDetail
        "200":
          description: 相册和照片元数据
          content:
            application/json:
              schema:
                type: object
                required: [album, photos]
                properties:
                  album: { $ref: "#/components/schemas/Album" }
                  photos: { type: array, items: { $ref: "#/components/schemas/AlbumPhoto" } }
    delete:
      responses:
        "204": { description: 已删除相册和照片 }
  /public/albums/{id}:
    parameters: *albumId
    get:
      security: []
      responses: *albumDetail
  /albums/{id}/cover:
    parameters: *albumId
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photoId]
              properties:
                photoId: { type: string }
      responses:
        "204": { description: 已设置该相册中的一张照片为封面 }
        "404": { description: 照片不在该相册中 }
  /albums/{id}/photos:
    parameters: *albumId
    post:
      description: 每请求最多 5 张、合计 22 MiB，单张最多 10 MiB；接收 JPEG、PNG、WebP 或 GIF 并保存压缩后的 JPEG 和缩略图。网站会在上传前将 HEIC/HEIF 转为可提交的图片格式。可读照片独立于坏图保存。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files: { type: array, maxItems: 5, items: { type: string, format: binary } }
      responses:
        "200":
          description: 已保存照片，以及未读取照片在本次请求中的索引（从 0 开始）
          content:
            application/json:
              schema:
                type: object
                required: [photos, rejected]
                properties:
                  photos: { type: array, items: { $ref: "#/components/schemas/AlbumPhoto" } }
                  rejected: { type: array, items: { type: integer } }
  /albums/{id}/photos/{photo}:
    parameters: &photoTarget
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: photo, in: path, required: true, schema: { type: string } }
    get:
      parameters: &thumbnail
        - { name: thumbnail, in: query, schema: { type: boolean, default: false } }
      responses: &photoResponse
        "200":
          description: 经过授权的图片数据，private, no-store
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
        "302": { description: 重定向至已有静态图片 }
    delete:
      responses:
        "204": { description: 已删除照片；如果是封面，将自动回退至首图 }
  /public/albums/{id}/photos/{photo}:
    parameters: *photoTarget
    get:
      security: []
      parameters: *thumbnail
      responses: *photoResponse
  /push:
    get:
      responses:
        "200":
          description: 服务器 VAPID 公钥与当前会话订阅状态
          content:
            application/json:
              schema:
                type: object
                required: [publicKey, enabled]
                properties:
                  publicKey: { type: string }
                  enabled: { type: boolean }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, p256dh, auth]
              properties:
                endpoint: { type: string, format: uri }
                p256dh: { type: string }
                auth: { type: string }
      responses:
        "204": { description: 当前登录会话已订阅 }
    delete:
      responses:
        "204": { description: 当前登录会话已取消订阅 }
  /push/status:
    get:
      responses:
        "200":
          description: Service Worker 专用，不返回任何私人内容。
          content:
            application/json:
              schema:
                type: object
                required: [enabled, unread]
                properties:
                  enabled: { type: boolean }
                  unread: { type: integer, format: int64 }

  /places:
    get:
      description: 登录成员可见的全部足迹元数据；不包含原图或 Base64。private, no-store。
      responses:
        "200":
          description: 按顺序排列的轻量足迹
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Place" } }
        "401": { description: 请先登录 }
  /public/places:
    get:
      security: []
      description: 每次检查足迹访客可见设置；不包含图片正文，no-store。
      responses:
        "200":
          description: 含公开图片 URL 的轻量足迹列表
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Place" } }
        "403": { description: 足迹未向访客开放 }
  /admin/places:
    post:
      description: 管理员新增足迹；要求 CSRF。图片必须为有效 JPEG、PNG 或 WebP data URL，比例 6–8:1。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PlaceInput"
                - type: object
                  required: [panoramaImage]
      responses:
        "201":
          description: 新足迹元数据，不回传图片正文
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Place" }
        "400": { description: 内容或图片无效 }
        "401": { description: 请先登录 }
        "403": { description: 仅管理员可写，或 CSRF 无效 }
        "429": { description: 图片处理繁忙，请稍后重试 }
  /admin/places/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    patch:
      description: 管理员编辑，要求 CSRF。省略或 null 的 panoramaImage 保留旧图；空串或资源 URL 不可作为新图。文字编辑不改变图片版本。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceInput" }
      responses:
        "200":
          description: 更新后的轻量足迹
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Place" }
        "400": { description: 内容或图片无效 }
        "401": { description: 请先登录 }
        "403": { description: 仅管理员可写，或 CSRF 无效 }
        "404": { description: 足迹已删除 }
        "429": { description: 图片处理繁忙，请稍后重试 }
    delete:
      description: 管理员删除足迹及派生图，要求 CSRF。
      responses:
        "204": { description: 已删除 }
        "401": { description: 请先登录 }
        "403": { description: 仅管理员可写，或 CSRF 无效 }
        "404": { description: 足迹已删除 }
  /admin/places/reorder:
    patch:
      description: 管理员提交全部足迹 ID 的目标顺序，要求 CSRF；返回轻量元数据。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, uniqueItems: true, items: { type: string, format: uuid } }
      responses:
        "200":
          description: 重排后的轻量足迹
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Place" } }
        "400": { description: 足迹列表已变化，请刷新 }
        "403": { description: 仅管理员可写，或 CSRF 无效 }
  /media/places/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      - { in: query, name: v, required: true, schema: { type: string, format: uuid }, description: 图片版本；旧版本不可读取新内容 }
      - { in: query, name: w, schema: { type: integer, enum: [960, 1920, 3200], default: 1920 }, description: 目标宽度；不放大原图 }
    get:
      description: 成员鉴权读取独立 JPEG 派生图，private, no-store；存量图片首次读取时受限生成，不将私图持久化到浏览器。
      responses:
        "200":
          description: JPEG 图片
          headers:
            Cache-Control: { schema: { type: string }, description: "private, no-store" }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "400": { description: 无效尺寸或版本参数 }
        "401": { description: 请先登录 }
        "404": { description: 图片或版本不存在 }
        "422": { description: 旧图片无法安全解码；原数据保留 }
        "429": { description: 图片处理繁忙 }
  /public/media/places/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      - { in: query, name: v, required: true, schema: { type: string, format: uuid } }
      - { in: query, name: w, schema: { type: integer, enum: [960, 1920, 3200], default: 1920 } }
    get:
      security: []
      description: 每次先检查足迹公开设置、存在性和版本，再处理 ETag。仅成功图片可 private, no-cache；撤权和错误 no-store，不使用长期强缓存。
      parameters:
        - { in: header, name: If-None-Match, schema: { type: string } }
      responses:
        "200":
          description: 允许公开的 JPEG 派生图
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "private, no-cache" }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "304":
          description: 权限和版本有效且图片未变化
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "private, no-cache" }
        "400": { description: 无效尺寸或版本参数 }
        "403": { description: 足迹未向访客开放；不返回 304 }
        "404": { description: 图片或版本不存在 }
        "422": { description: 旧图片无法安全解码 }
        "429": { description: 图片处理繁忙 }
  /public/music:
    get:
      security: []
      description: >-
        访客只读取当前背景歌曲 ID 与递增 revision，不返回曲库、标题、上传者、文件路径或容量限制。
        每次检查访客模式：PRIVATE 全站否决；SELECTED 允许当前曲，独立于首页、时光等模块开关。
        未选曲时 selectedTrackId 为 null。成功与错误均 no-store，不处理缓存条件或返回 304。
      responses:
        "200":
          description: 当前背景音乐的最小公开快照
          headers:
            Cache-Control: { schema: { type: string }, description: "private, no-store" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMusicSnapshot" }
        "403": { description: PRIVATE 模式或无效访客设置，不公开音乐；no-store }
  /public/music/tracks/{id}/content:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: Range, in: header, schema: { type: string }, description: 单一 HTTP 字节范围，支持后缀范围；不支持多段范围 }
    get:
      security: []
      description: >-
        只公开当前选中的背景歌曲，曲库及管理仍需登录、写操作仍需 CSRF。
        每次 GET（包括 Range）先检查访客模式，再用 SQL JOIN 限定当前 selection 才读取资源，最后处理 Range；
        PRIVATE 返回 403，非当前、已删除或不存在的歌曲统一 404，不能由无效 Range 或缓存条件绕过。
        SELECTED 下独立于页面模块开关。所有响应 no-store，不返回 304。
      responses:
        "200":
          description: 当前背景歌曲完整音频
          headers:
            Cache-Control: { schema: { type: string }, description: "private, no-store" }
            Accept-Ranges: { schema: { type: string }, description: bytes }
            Content-Disposition: { schema: { type: string }, description: 固定 inline 文件名，不公开原文件名 }
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
        "206":
          description: 当前背景歌曲的有效字节范围
          headers:
            Content-Range: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: "private, no-store" }
            Accept-Ranges: { schema: { type: string }, description: bytes }
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
        "400": { description: 音乐 ID 格式无效；no-store }
        "403": { description: PRIVATE 模式或无效访客设置；优先于 ID、Range 和缓存条件；no-store }
        "404": { description: 歌曲非当前、未选曲、已删除或不存在；优先于 Range；no-store }
        "416":
          description: 当前歌曲可访问，但字节范围无效；no-store
          headers:
            Content-Range: { schema: { type: string }, description: "bytes */文件长度" }
            Cache-Control: { schema: { type: string }, description: "private, no-store" }
        "503": { description: 音乐存储暂时不可用；no-store }
    head:
      security: []
      description: 与公开 GET 相同的逐请求访客模式、当前 selection JOIN 及 Range 校验；无响应正文，所有响应 no-store。仅此新内容路径放行匿名 HEAD，不放宽私有接口。
      responses:
        "200":
          description: 当前背景歌曲元数据，无正文
          headers:
            Content-Type: { schema: { type: string, enum: [audio/mpeg, audio/wav] } }
            Content-Length: { schema: { type: integer, format: int64 } }
            Cache-Control: { schema: { type: string }, description: "private, no-store" }
            Accept-Ranges: { schema: { type: string }, description: bytes }
        "206":
          description: 当前背景歌曲的有效字节范围元数据，无正文
          headers:
            Content-Range: { schema: { type: string } }
            Content-Length: { schema: { type: integer, format: int64 } }
            Cache-Control: { schema: { type: string }, description: "private, no-store" }
        "400": { description: 音乐 ID 格式无效；no-store }
        "403": { description: PRIVATE 模式或无效访客设置；no-store }
        "404": { description: 歌曲非当前、未选曲、已删除或不存在；no-store }
        "416":
          description: 当前歌曲可访问，但字节范围无效；no-store
          headers:
            Content-Range: { schema: { type: string }, description: "bytes */文件长度" }
            Cache-Control: { schema: { type: string }, description: "private, no-store" }
        "503": { description: 音乐存储暂时不可用；no-store }
  /music:
    get:
      description: 两位登录成员共享的私有曲库和全站选曲一致快照。不返回文件系统路径。
      responses:
        "200":
          description: 曲库、当前歌曲及递增版本；声音开关不在此共享
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicSnapshot" }
        "401": { description: 请先登录 }
  /music/tracks:
    post:
      description: 双方均可上传 MP3 或 PCM WAV；不自动改变当前背景音乐。要求 CSRF。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 最大 20 MiB，必须为有效的 MP3 或 PCM WAV }
                title: { type: string, maxLength: 120, description: 可选显示名称；省略时使用文件名 }
      responses:
        "201":
          description: 上传成功后的共享快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicSnapshot" }
        "400": { description: 文件或显示名称无效 }
        "401": { description: 请先登录 }
        "403": { description: CSRF 令牌无效 }
        "409": { description: 曲库数量或总容量达到上限 }
        "413": { description: 文件超过大小上限 }
        "415": { description: 不支持的音频格式 }
        "429": { description: 同时上传过多，请稍后重试 }
  /music/selection:
    put:
      description: 设置全站共享背景音乐；null 清空选择。重复选择无副作用。要求 CSRF。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackId]
              properties:
                trackId: { type: string, format: uuid, nullable: true }
      responses:
        "200":
          description: 设置成功后的共享快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicSnapshot" }
        "401": { description: 请先登录 }
        "403": { description: CSRF 令牌无效 }
        "404": { description: 歌曲不存在或已删除 }
  /music/tracks/{id}:
    delete:
      description: 双方均可删除；当前歌曲被删除时同时清空选择。要求 CSRF。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 删除成功后的共享快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicSnapshot" }
        "401": { description: 请先登录 }
        "403": { description: CSRF 令牌无效 }
        "404": { description: 歌曲不存在或已删除 }
  /music/tracks/{id}/content:
    get:
      description: 私有同源音频流；每次请求（包括 Range）校验会话，禁止缓存。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Range, in: header, schema: { type: string }, description: HTTP 字节范围 }
      responses:
        "200":
          description: 完整音频
          headers:
            Cache-Control: { schema: { type: string }, description: "private, no-store" }
            Accept-Ranges: { schema: { type: string }, description: bytes }
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
        "206":
          description: 有效的字节范围
          headers:
            Content-Range: { schema: { type: string } }
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
        "401": { description: 请先登录 }
        "404": { description: 歌曲不存在或已删除 }
        "416": { description: 字节范围无效 }
    head:
      description: 与 GET 相同的鉴权和音频元数据，无响应正文。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 音频元数据 }
        "401": { description: 请先登录 }
        "404": { description: 歌曲不存在或已删除 }
  /account/profile:
    get:
      responses:
        "200":
          description: 当前登录账号的资料，不含密码和密码哈希
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
        "401": { description: 请先登录 }
    patch:
      description: 仅修改当前账号。修改用户名或密码须验证旧密码并退出所有登录会话；昵称可独立修改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, minLength: 1, maxLength: 40 }
                username: { type: string, pattern: '^[a-zA-Z0-9_]{3,40}$' }
                oldPassword: { type: string, maxLength: 200 }
                newPassword: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "200":
          description: 保存成功，loginRequired 为 true 时需重新登录
          content:
            application/json:
              schema:
                type: object
                required: [profile, loginRequired]
                properties:
                  profile: { $ref: "#/components/schemas/AccountProfile" }
                  loginRequired: { type: boolean }
        "400": { description: 旧密码不正确、缺少旧密码或输入不合规 }
        "401": { description: 请先登录 }
        "409": { description: 用户名已被占用 }
        "429": { description: 旧密码尝试次数过多，请稍后重试 }
  /activities:
    get:
      description: 登录成员的更新记录。仅展示当前账号可见的站内动态，按实际写入顺序倒序；打开列表不会标记已读。
      parameters:
        - { name: all, in: query, schema: { type: boolean, default: false }, description: 包含自己的操作 }
        - { name: before, in: query, schema: { type: integer, format: int64 }, description: 下一页游标 }
      responses:
        "200":
          description: 最多 30 条动态、全局未读数与分页游标
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityFeed" }
        "401": { description: 请先登录 }
  /activities/{id}/read:
    post:
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: 仅标记当前登录账号已读，重复调用无副作用 }
        "404": { description: 动态不存在 }
  /activities/read-all:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [throughId]
              properties:
                throughId: { type: integer, format: int64, minimum: 0 }
      responses:
        "204": { description: 标记该游标及之前的动态已读，随后产生的新动态保持未读 }
  /auth/me:
    get:
      security: []
      responses:
        "200":
          description: 当前用户，匿名时 name 和 role 为 null
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string, nullable: true }
                  role: { type: string, nullable: true }
  /auth/csrf:
    get:
      security: []
      responses:
        "200":
          description: 写操作请求头
          content:
            application/json:
              schema:
                type: object
                required: [token, headerName]
                properties:
                  token: { type: string }
                  headerName: { type: string }
  /auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 80 }
                password: { type: string, maxLength: 200 }
      responses:
        "200": { description: 登录成功并轮换会话 ID }
        "401": { description: 账户或密码错误 }
        "429": { description: 请稍后重试 }
  /auth/logout:
    post:
      responses:
        "204": { description: 会话已销毁 }
  /public/memories:
    get:
      security: []
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
      responses:
        "200":
          description: 24 条公开精选，按日期倒序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicMemory" }
        "403": { description: 时光模块未向访客开放 }
  /public/memories/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      security: []
      responses:
        "200":
          description: 公开详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMemory" }
        "404": { description: 不存在、草稿、私密或已删除 }
        "403": { description: 时光模块未向访客开放 }
  /memories:
    get:
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
      responses:
        "200":
          description: 24 条完整回忆，按日期倒序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PrivateMemory" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryInput" }
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateMemory" }
  /memories/{id}:
    get:
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 登录成员读取指定回忆，不受列表分页限制
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateMemory" }
        "404": { description: 不存在或已删除 }

    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryInput" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateMemory" }
        "409": { description: 版本冲突，请保留输入并重新载入 }
    delete:
      responses:
        "204": { description: 移入回收站 }
  /trash:
    get:
      responses:
        "200":
          description: 回收站最近 100 条
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PrivateMemory" }
  /trash/{id}/restore:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      responses:
        "204": { description: 已恢复 }
  /anniversaries:
    get:
      responses:
        "200":
          description: 纪念日
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Anniversary" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnniversaryInput" }
      responses:
        "200":
          description: 已创建，默认私密
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Anniversary" }
  /anniversaries/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnniversaryInput" }
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Anniversary" }
    delete:
      responses:
        "204": { description: 已删除 }
  /anniversaries/reorder:
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "204": { description: 排序已更新 }
  /public/anniversaries:
    get:
      security: []
      responses:
        "200":
          description: 公开纪念日
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Anniversary" }
        "403": { description: 纪念日模块未向访客开放 }
  /public/privacy:
    get:
      security: []
      responses:
        "200":
          description: 当前访客可见范围
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyPolicy" }
  /admin/privacy:
    get:
      responses:
        "200":
          description: 管理员读取访客可见范围
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyPolicy" }
        "403": { description: 仅管理员可以读取 }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacyPolicy" }
      responses:
        "200":
          description: 访客可见范围已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyPolicy" }
        "403": { description: 仅管理员可以修改 }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: SESSION }
  schemas:
    PlaceImageVariant:
      type: object
      required: [url, width, height]
      properties:
        url: { type: string, description: 同源鉴权图片 URL }
        width: { type: integer, minimum: 1, description: 文件真实宽度，不是目标档位 }
        height: { type: integer, minimum: 1 }
    PlaceImage:
      type: object
      required: [url, version, width, height, variants]
      properties:
        url: { type: string, description: 默认1920档预览 URL；包含 w 与 v 参数 }
        version: { type: string, format: uuid, description: 仅换图时变化 }
        width: { type: integer, nullable: true, description: 源图宽；旧图尚未派生时为 null }
        height: { type: integer, nullable: true, description: 源图高；旧图尚未派生时为 null }
        variants: { type: array, items: { $ref: "#/components/schemas/PlaceImageVariant" }, description: 已知实际尺寸，不放大、不重复；旧图首次派生前为空 }
    Place:
      type: object
      required: [id, city, visitDate, description, sortOrder, image]
      properties:
        id: { type: string, format: uuid }
        city: { type: string, maxLength: 100 }
        visitDate: { type: string, format: date, nullable: true }
        description: { type: string, maxLength: 500 }
        sortOrder: { type: integer }
        image: { $ref: "#/components/schemas/PlaceImage" }
    PlaceInput:
      type: object
      required: [city]
      properties:
        city: { type: string, minLength: 1, maxLength: 100 }
        visitDate: { type: string, format: date, nullable: true }
        description: { type: string, maxLength: 500 }
        panoramaImage: { type: string, nullable: true, maxLength: 8000000, description: 新建必填有效 data URL；编辑省略/null保留，空串拒绝；不接受资源URL }
    MusicTrack:
      type: object
      required: [id, title, contentType, byteSize, createdAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 120 }
        contentType: { type: string, enum: [audio/mpeg, audio/wav] }
        byteSize: { type: integer, format: int64, minimum: 1 }
        createdAt: { type: string, format: date-time }
    MusicLimits:
      type: object
      required: [maxFileBytes, maxTracks, maxTotalBytes]
      properties:
        maxFileBytes: { type: integer, format: int64, default: 20971520 }
        maxTracks: { type: integer, default: 20 }
        maxTotalBytes: { type: integer, format: int64, default: 209715200 }
    PublicMusicSnapshot:
      type: object
      additionalProperties: false
      description: 仅公开当前歌曲的标识与 revision；不包含曲库元数据。授权仅限当前选曲，换歌、清空或删除后旧内容 URL 即失效。
      required: [selectedTrackId, revision]
      properties:
        selectedTrackId: { type: string, format: uuid, nullable: true }
        revision: { type: integer, format: int64, minimum: 0 }
    MusicSnapshot:
      type: object
      required: [tracks, selectedTrackId, revision, limits]
      properties:
        tracks: { type: array, items: { $ref: "#/components/schemas/MusicTrack" } }
        selectedTrackId: { type: string, format: uuid, nullable: true }
        revision: { type: integer, format: int64, minimum: 0 }
        limits: { $ref: "#/components/schemas/MusicLimits" }
    AccountProfile:
      type: object
      required: [id, username, nickname, role]
      properties:
        id: { type: integer }
        username: { type: string }
        nickname: { type: string }
        role: { type: string, enum: [ADMIN, MEMBER] }

    Activity:
      type: object
      required: [id, actor, mine, module, targetId, action, title, summary, route, createdAt, read, deleted]
      properties:
        id: { type: integer, format: int64 }
        actor: { type: string, description: 操作者昵称 }
        mine: { type: boolean }
        module: { type: string }
        targetId: { type: string }
        action: { type: string }
        title: { type: string }
        summary: { type: string }
        route: { type: string }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        deleted: { type: boolean, description: 目标当前是否已删除 }
    ActivityFeed:
      type: object
      required: [items, unread, latestId, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Activity" } }
        unread: { type: integer, format: int64 }
        latestId: { type: integer, format: int64 }
        nextCursor: { type: integer, format: int64, nullable: true }

    PrivacyPolicy:
      type: object
      description: PRIVATE 否决所有访客内容（含音乐）；SELECTED 按模块开关开放页面内容，当前背景歌曲独立于这些开关允许访客读取，不公开曲库。
      required: [mode, home, timeline, anniversaries, albums, places]
      properties:
        mode:
          type: string
          enum: [PRIVATE, SELECTED]
        home: { type: boolean }
        timeline: { type: boolean }
        anniversaries: { type: boolean }
        albums: { type: boolean }
        places: { type: boolean }
    MemoryInput:
      type: object
      required:
        [
          title,
          body,
          date,
          city,
          tag,
          image,
          published,
          publicVisible,
          publicSummary,
          version,
        ]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 20000 }
        date: { type: string, format: date }
        city: { type: string, maxLength: 60 }
        tag: { type: string, maxLength: 40 }
        image: { type: string, maxLength: 4000000 }
        published: { type: boolean, default: false }
        publicVisible: { type: boolean, default: false }
        publicSummary: { type: string, maxLength: 500 }
        version: { type: integer, format: int64 }
    PublicMemory:
      type: object
      required:
        [
          id,
          title,
          date,
          city,
          tag,
          image,
          publicSummary,
          published,
          publicVisible,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        date: { type: string, format: date }
        city: { type: string }
        tag: { type: string }
        image: { type: string }
        publicSummary: { type: string }
        published: { type: boolean }
        publicVisible: { type: boolean }
    SettingValue:
      type: object
      required: [value]
      properties:
        value: { type: string, description: JSON 序列化内容 }
        revision: { type: string, nullable: true, description: 记录盒与愿望单的并发更新版本 }
    PostInteractions:
      type: object
      required: [liked, likes, commentCount, comments, nextBefore]
      properties:
        liked: { type: boolean }
        likes: { type: integer }
        commentCount: { type: integer }
        nextBefore: { type: integer, format: int64, nullable: true }
        comments:
          type: array
          items:
            type: object
            required: [id, authorId, body, createdAt]
            properties:
              id: { type: integer, format: int64 }
              authorId: { type: integer }
              body: { type: string }
              createdAt: { type: string, format: date-time }
    AlbumInput:
      type: object
      required: [title, description, category, date]
      properties:
        title: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 300 }
        category: { type: string, enum: [event, thing] }
        date: { type: string, format: date }
    Album:
      allOf:
        - $ref: "#/components/schemas/AlbumInput"
        - type: object
          required: [id, coverId, cover, photoCount]
          properties:
            id: { type: string }
            coverId: { type: string, nullable: true }
            cover:
              nullable: true
              allOf: [{ $ref: "#/components/schemas/AlbumPhoto" }]
            photoCount: { type: integer }
    AlbumPhoto:
      type: object
      required: [id, src, thumbnail, note, date]
      properties:
        id: { type: string }
        src: { type: string }
        thumbnail: { type: string }
        note: { type: string }
        date: { type: string }
    PrivateMemory:
      allOf:
        - { $ref: "#/components/schemas/PublicMemory" }
        - type: object
          required: [body, version, deleted]
          properties:
            body: { type: string }
            version: { type: integer, format: int64 }
            deleted: { type: boolean }
            authorId: { type: integer, nullable: true }
            publishedAt: { type: string, format: date-time, nullable: true }
    AnniversaryInput:
      type: object
      required: [title, date, annual]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        date: { type: string, format: date }
        annual: { type: boolean }
        lunar:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/LunarDate" }]
    LunarDate:
      type: object
      required: [month, day]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        day: { type: integer, minimum: 1, maximum: 30 }
    Anniversary:
      allOf:
        - { $ref: "#/components/schemas/AnniversaryInput" }
        - type: object
          required: [id, sortOrder]
          properties:
            id: { type: string, format: uuid }
            sortOrder: { type: integer }
