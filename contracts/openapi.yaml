openapi: 3.0.3
info:
  title: 拾光 API
  version: 0.1.0
  description: 初始工程的已实现接口。所有写操作必须提交 CSRF 请求头。
servers:
  - url: /api/v1
security:
  - session: []
paths:
  /account/profile:
    get:
      responses:
        "200":
          description: 当前登录账号的资料，不含密码和密码哈希
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
        "401": { description: 请先登录 }
    patch:
      description: 仅修改当前账号。修改用户名或密码须验证旧密码并退出所有登录会话；昵称可独立修改。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, minLength: 1, maxLength: 40 }
                username: { type: string, pattern: '^[a-zA-Z0-9_]{3,40}$' }
                oldPassword: { type: string, maxLength: 200 }
                newPassword: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "200":
          description: 保存成功，loginRequired 为 true 时需重新登录
          content:
            application/json:
              schema:
                type: object
                required: [profile, loginRequired]
                properties:
                  profile: { $ref: "#/components/schemas/AccountProfile" }
                  loginRequired: { type: boolean }
        "400": { description: 旧密码不正确、缺少旧密码或输入不合规 }
        "401": { description: 请先登录 }
        "409": { description: 用户名已被占用 }
        "429": { description: 旧密码尝试次数过多，请稍后重试 }
  /activities:
    get:
      description: 登录成员的更新记录。仅展示当前账号可见的站内动态，按实际写入顺序倒序；打开列表不会标记已读。
      parameters:
        - { name: all, in: query, schema: { type: boolean, default: false }, description: 包含自己的操作 }
        - { name: before, in: query, schema: { type: integer, format: int64 }, description: 下一页游标 }
      responses:
        "200":
          description: 最多 30 条动态、全局未读数与分页游标
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityFeed" }
        "401": { description: 请先登录 }
  /activities/{id}/read:
    post:
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: 仅标记当前登录账号已读，重复调用无副作用 }
        "404": { description: 动态不存在 }
  /activities/read-all:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [throughId]
              properties:
                throughId: { type: integer, format: int64, minimum: 0 }
      responses:
        "204": { description: 标记该游标及之前的动态已读，随后产生的新动态保持未读 }
  /auth/me:
    get:
      security: []
      responses:
        "200":
          description: 当前用户，匿名时 name 和 role 为 null
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string, nullable: true }
                  role: { type: string, nullable: true }
  /auth/csrf:
    get:
      security: []
      responses:
        "200":
          description: 写操作请求头
          content:
            application/json:
              schema:
                type: object
                required: [token, headerName]
                properties:
                  token: { type: string }
                  headerName: { type: string }
  /auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, maxLength: 80 }
                password: { type: string, maxLength: 200 }
      responses:
        "200": { description: 登录成功并轮换会话 ID }
        "401": { description: 账户或密码错误 }
        "429": { description: 请稍后重试 }
  /auth/logout:
    post:
      responses:
        "204": { description: 会话已销毁 }
  /public/memories:
    get:
      security: []
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
      responses:
        "200":
          description: 24 条公开精选，按日期倒序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PublicMemory" }
        "403": { description: 时光模块未向访客开放 }
  /public/memories/{id}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    get:
      security: []
      responses:
        "200":
          description: 公开详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMemory" }
        "404": { description: 不存在、草稿、私密或已删除 }
        "403": { description: 时光模块未向访客开放 }
  /memories:
    get:
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 0, default: 0 },
          }
      responses:
        "200":
          description: 24 条完整回忆，按日期倒序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PrivateMemory" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryInput" }
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateMemory" }
  /memories/{id}:
    get:
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 登录成员读取指定回忆，不受列表分页限制
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateMemory" }
        "404": { description: 不存在或已删除 }

    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryInput" }
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateMemory" }
        "409": { description: 版本冲突，请保留输入并重新载入 }
    delete:
      responses:
        "204": { description: 移入回收站 }
  /trash:
    get:
      responses:
        "200":
          description: 回收站最近 100 条
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PrivateMemory" }
  /trash/{id}/restore:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: string, format: uuid },
        }
    post:
      responses:
        "204": { description: 已恢复 }
  /anniversaries:
    get:
      responses:
        "200":
          description: 纪念日
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Anniversary" }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnniversaryInput" }
      responses:
        "200":
          description: 已创建，默认私密
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Anniversary" }
  /anniversaries/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnniversaryInput" }
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Anniversary" }
    delete:
      responses:
        "204": { description: 已删除 }
  /anniversaries/reorder:
    patch:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "204": { description: 排序已更新 }
  /public/anniversaries:
    get:
      security: []
      responses:
        "200":
          description: 公开纪念日
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Anniversary" }
        "403": { description: 纪念日模块未向访客开放 }
  /public/privacy:
    get:
      security: []
      responses:
        "200":
          description: 当前访客可见范围
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyPolicy" }
  /admin/privacy:
    get:
      responses:
        "200":
          description: 管理员读取访客可见范围
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyPolicy" }
        "403": { description: 仅管理员可以读取 }
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacyPolicy" }
      responses:
        "200":
          description: 访客可见范围已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyPolicy" }
        "403": { description: 仅管理员可以修改 }
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: SESSION }
  schemas:
    AccountProfile:
      type: object
      required: [id, username, nickname, role]
      properties:
        id: { type: integer }
        username: { type: string }
        nickname: { type: string }
        role: { type: string, enum: [ADMIN, MEMBER] }

    Activity:
      type: object
      required: [id, actor, mine, module, targetId, action, title, summary, route, createdAt, read, deleted]
      properties:
        id: { type: integer, format: int64 }
        actor: { type: string, description: 操作者昵称 }
        mine: { type: boolean }
        module: { type: string }
        targetId: { type: string }
        action: { type: string }
        title: { type: string }
        summary: { type: string }
        route: { type: string }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        deleted: { type: boolean, description: 目标当前是否已删除 }
    ActivityFeed:
      type: object
      required: [items, unread, latestId, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Activity" } }
        unread: { type: integer, format: int64 }
        latestId: { type: integer, format: int64 }
        nextCursor: { type: integer, format: int64, nullable: true }

    PrivacyPolicy:
      type: object
      required: [mode, home, timeline, anniversaries, albums, places]
      properties:
        mode:
          type: string
          enum: [PRIVATE, SELECTED]
        home: { type: boolean }
        timeline: { type: boolean }
        anniversaries: { type: boolean }
        albums: { type: boolean }
        places: { type: boolean }
    MemoryInput:
      type: object
      required:
        [
          title,
          body,
          date,
          city,
          tag,
          image,
          published,
          publicVisible,
          publicSummary,
          version,
        ]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 20000 }
        date: { type: string, format: date }
        city: { type: string, maxLength: 60 }
        tag: { type: string, maxLength: 40 }
        image: { type: string, maxLength: 4000000 }
        published: { type: boolean, default: false }
        publicVisible: { type: boolean, default: false }
        publicSummary: { type: string, maxLength: 500 }
        version: { type: integer, format: int64 }
    PublicMemory:
      type: object
      required:
        [
          id,
          title,
          date,
          city,
          tag,
          image,
          publicSummary,
          published,
          publicVisible,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        date: { type: string, format: date }
        city: { type: string }
        tag: { type: string }
        image: { type: string }
        publicSummary: { type: string }
        published: { type: boolean }
        publicVisible: { type: boolean }
    PrivateMemory:
      allOf:
        - { $ref: "#/components/schemas/PublicMemory" }
        - type: object
          required: [body, version, deleted]
          properties:
            body: { type: string }
            version: { type: integer, format: int64 }
            deleted: { type: boolean }
    AnniversaryInput:
      type: object
      required: [title, date, annual]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        date: { type: string, format: date }
        annual: { type: boolean }
        lunar:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/LunarDate" }]
    LunarDate:
      type: object
      required: [month, day]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        day: { type: integer, minimum: 1, maximum: 30 }
    Anniversary:
      allOf:
        - { $ref: "#/components/schemas/AnniversaryInput" }
        - type: object
          required: [id, sortOrder]
          properties:
            id: { type: string, format: uuid }
            sortOrder: { type: integer }
