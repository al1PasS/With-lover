map "$request_method:$uri" $album_image_request {
  default 0;
  "~^(GET|HEAD):/api/v1/(public/)?albums/[^/]+/photos/[^/]+$" 1;
}
map $album_image_request $api_limit_key {
  0 $binary_remote_addr;
  1 "";
}
map $album_image_request $album_image_limit_key {
  0 "";
  1 $binary_remote_addr;
}
limit_req_zone $api_limit_key zone=api:10m rate=10r/s;
limit_req_zone $album_image_limit_key zone=album_images:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
map "$uri:$status" $place_image_cache {
  default "no-store, private";
  "~^/api/v1/public/media/places/[0-9a-fA-F-]{36}:(200|304)$" "private, no-cache";
}
map $uri $cache_control {
  default "no-store";
  ~^/api/v1/(public/)?media/cover$ "private, no-cache";
  "~^/api/v1/public/media/places/[0-9a-fA-F-]{36}$" $place_image_cache;
  ~^/api/ "no-store, private";
  ~^/assets/ "public, max-age=31536000, immutable";
  ~^/images/ "public, no-cache";
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  client_max_body_size 22m;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout 90s;

  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data: blob:; media-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'" always;
  add_header Cache-Control $cache_control always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /api/v1/auth/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://api:8080;
    proxy_read_timeout 30s;
  }

  location ~ ^/api/v1/albums/[^/]+/photos$ {
    client_max_body_size 52m;
    limit_req zone=api burst=30 nodelay;
    proxy_pass http://api:8080;
    proxy_hide_header Cache-Control;
  }

  location /api/ {
    limit_req zone=api burst=30 nodelay;
    limit_req zone=album_images burst=80 nodelay;
    proxy_pass http://api:8080;
    proxy_hide_header Cache-Control;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
